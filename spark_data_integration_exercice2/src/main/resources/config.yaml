# Seuil maximum auxquels les données seront filtrées, permet de filtrer les données aberrantes
filters_thresholds:
  fare_amount: null
  extra: null
  mta_tax: null
  tip_amount: null
  tolls_amount: null
  improvement_surcharge: null
  total_amount: null
  congestion_surcharge: null
  Airport_fee: null
  cbd_congestion_fee: null

app:
  spark:
    app_name: "spark_data_integration_exercice2"
    master: "local[*]"  # Utilise tous les coeurs de la machine
    local_copy: true
  s3:
    endpoint: "http://localhost:9000" # Pointe vers le bucket RustFS (serveur S3)
    nyc_bucket: "s3a://nyc-bucket/"
    raw_path: "nyc_raw"
    processed_path: "nyc_processed"
    parquets: [ "yellow_tripdata_2026-07.parquet" ]

  data_processing:
    quarantine: false # la quarantaine permet de garder en mémoire les données filtrées, s'il y a une erreur dans le traitement des données
    quarantine_path: "nyc_quarantine" # chemin où seront stockées les données filtrées

  local_paths:
    raw_local_path: "/data/raw"
    processed_local_path: "/data/processed"
    quarantine_local_path: "/data/quarantine"