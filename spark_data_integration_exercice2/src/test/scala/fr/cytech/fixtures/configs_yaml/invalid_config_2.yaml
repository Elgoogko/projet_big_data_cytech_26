# Seuil maximum auxquels les données seront filtrées, permet de filtrer les données aberrantes
filters_thresholds:
  fare_amount: null
  extra: null
  mta_tax: null
  tip_amount: null
  tolls_amount: null
  improvement_surcharge: null
  total_amount: null
  congestion_surcharge: null
  Airport_fee: null
  cbd_congestion_fee: null

app:
  spark:
    app_name: "spark_data_integration_exercice2"
    master: "local[*]"  # Utilise tous les coeurs de la machine
  s3:
    raw_path: "s3a://nyc-bucket/nyc_raw"
    parquets: [ "yellow_tripdata_2026-07.parquet" ]

  data_processing:
    quarantine: true # la quarantaine permet de garder en mémoire les données filtrées, s'il y a une erreur dans le traitement des données
