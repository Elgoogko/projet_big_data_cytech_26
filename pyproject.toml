[project]
name = "projet-big-data-cytech-26"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.43.126",
    "dotenv>=0.9.9",
    "marimo>=0.25.2",
    "pandas>=2.3.3",
    "plotly>=7.1.0",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=25.0.1",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.58",
    "streamlit>=1.65.0",
]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
